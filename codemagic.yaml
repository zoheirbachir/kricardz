# Codemagic CI/CD — builds the KriCar iOS app in the cloud (no Mac needed).
# Repo layout: web app in ./frontend, native iOS project in ./frontend/ios/App.
#
# ─────────────────────────────────────────────────────────────────────────────
# WORKFLOW 1 — "ios-build-check" (FREE, no Apple account)
#   Compiles the app on Codemagic's Mac to prove it builds. Produces an UNSIGNED
#   .app (not installable on a phone) — it just verifies everything is healthy.
#
# WORKFLOW 2 — "ios-testflight" (needs the $99 Apple Developer account)
#   Signs the app and ships it to TestFlight so you install on your iPhone over
#   Wi-Fi. Uncomment the signing/publishing lines and follow the numbered TODOs.
# ─────────────────────────────────────────────────────────────────────────────

workflows:

  ios-build-check:
    name: KriCar iOS — build check (free)
    instance_type: mac_mini_m2
    max_build_duration: 60
    environment:
      node: 20
      xcode: latest
      cocoapods: default
    scripts:
      - name: Install web dependencies
        script: |
          cd frontend
          npm install
      - name: Build web assets (points app at the live backend)
        script: |
          cd frontend
          npm run build:mobile
      - name: Capacitor sync iOS (copies assets + runs pod install)
        script: |
          cd frontend
          npx cap sync ios
      - name: Compile iOS app (unsigned — verification only)
        script: |
          cd frontend/ios/App
          xcodebuild \
            -workspace App.xcworkspace \
            -scheme App \
            -configuration Release \
            -sdk iphoneos \
            -destination 'generic/platform=iOS' \
            CODE_SIGNING_ALLOWED=NO \
            build
    artifacts:
      - /tmp/xcodebuild_logs/*.log

  # ───────────────────────────────────────────────────────────────────────────
  # WORKFLOW 2 — ships a SIGNED build to TestFlight (needs the $99 Apple account).
  # Before the first run, do exactly ONE thing: replace APP_STORE_APPLE_ID below
  # with the app's Apple ID number (App Store Connect → your app → App Information →
  # "Apple ID"). Everything else is already wired.
  #   Prereqs (one-time, in the Apple/Codemagic dashboards, not in this file):
  #     1. App Store Connect → register App ID  dz.kricar.app  and create the app.
  #     2. App Store Connect → Users and Access → Integrations → create an API key.
  #     3. Codemagic → Teams → Integrations → App Store Connect → add that key,
  #        named EXACTLY  CodemagicAppStoreKey.
  ios-testflight:
    name: KriCar iOS — TestFlight
    instance_type: mac_mini_m2
    max_build_duration: 60
    integrations:
      app_store_connect: CodemagicAppStoreKey
    environment:
      node: 20
      xcode: latest
      cocoapods: default
      # NOTE: no `ios_signing:` block on purpose. That block does automatic
      # signing during environment setup and fails with "No matching profiles
      # found" when the profile doesn't exist yet — before any script runs.
      # Instead we create the certificate + profile ourselves in "Set up signing".
      vars:
        APP_STORE_APPLE_ID: 6789854020   # KriCar app's Apple ID (App Store Connect → App Information)
        BUNDLE_ID: dz.kricar.app
    scripts:
      - name: Install web dependencies
        script: cd frontend && npm install
      - name: Build web assets (points app at the live backend)
        script: cd frontend && npm run build:mobile
      - name: Capacitor sync iOS
        script: cd frontend && npx cap sync ios
      - name: Set up signing
        script: |
          # Apple's API can only create/save a signing certificate if we supply
          # the certificate's private key. Generate a fresh RSA key, then create
          # (or reuse) the iOS Distribution certificate + App Store provisioning
          # profile for the bundle id and patch the Xcode project to use them.
          keychain initialize
          ssh-keygen -t rsa -b 2048 -m PEM -f /tmp/kricar_dist_key -q -N ""
          app-store-connect fetch-signing-files "$BUNDLE_ID" \
            --type IOS_APP_STORE \
            --certificate-key=@file:/tmp/kricar_dist_key \
            --create \
            --verbose
          keychain add-certificates
          # Run from the repo root with no extra flags so it recursively finds
          # App.xcodeproj and switches it to manual signing with the profile.
          xcode-project use-profiles --verbose
      - name: Build signed IPA
        script: |
          # Run from the repo root (no cd) with the full workspace path so the
          # .ipa lands at build/ios/ipa/ where the artifacts/publisher expect it.
          xcode-project build-ipa \
            --workspace frontend/ios/App/App.xcworkspace \
            --scheme App
    artifacts:
      - build/ios/ipa/*.ipa
      - frontend/ios/App/build/ios/ipa/*.ipa
      - /tmp/xcodebuild_logs/*.log
    publishing:
      app_store_connect:
        auth: integration
        submit_to_testflight: true
